{% extends "base.html" %}
{% block title %}New Session{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-3">
  <a href="{{ url_for('sessions') }}" class="btn btn-outline-secondary me-3">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h2 class="mb-0"><i class="bi bi-plus-circle me-2"></i>New Session</h2>
</div>

<div class="card" style="max-width:540px;">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Subject <span class="text-danger">*</span></label>
        <input type="text" name="subject" class="form-control"
               placeholder="e.g. Network Administration" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Section <span class="text-danger">*</span></label>
        <input type="text" name="section" class="form-control"
               placeholder="e.g. BSIT-3A" required>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">Date <span class="text-danger">*</span></label>
          <input type="date" name="date" class="form-control"
                 value="{{ today }}" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">Start Time <span class="text-danger">*</span></label>
          <input type="time" name="start_time" class="form-control"
                 value="{{ now }}" required>
        </div>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">
          <i class="bi bi-save me-1"></i>Create Session
        </button>
        <a href="{{ url_for('sessions') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
