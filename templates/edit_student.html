{% extends "base.html" %}
{% block title %}Edit Student{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-3">
  <a href="{{ url_for('students') }}" class="btn btn-outline-secondary me-3">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h2 class="mb-0"><i class="bi bi-pencil me-2"></i>Edit Student</h2>
</div>

<div class="card" style="max-width:540px;">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Student ID</label>
        <input type="text" class="form-control" value="{{ student.student_id }}" disabled>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control"
               value="{{ student.name }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Course <span class="text-danger">*</span></label>
        <select name="course" class="form-select" required>
          {% for c in ['BSIT','BSCS','BSIS','BSCpE','BSECE'] %}
            <option value="{{ c }}" {% if student.course==c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">MAC Address</label>
        <input type="text" name="mac_address" class="form-control font-monospace"
               value="{{ student.mac_address or '' }}"
               placeholder="AA:BB:CC:DD:EE:FF"
               pattern="^([0-9A-Fa-f]{2}[:\-]){5}([0-9A-Fa-f]{2})$">
        <div class="form-text">Leave blank to remove.</div>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-save me-1"></i>Update
        </button>
        <a href="{{ url_for('students') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
