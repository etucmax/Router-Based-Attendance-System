{% extends "base.html" %}
{% block title %}Add Student{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-3">
  <a href="{{ url_for('students') }}" class="btn btn-outline-secondary me-3">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h2 class="mb-0"><i class="bi bi-person-plus me-2"></i>Add Student</h2>
</div>

<div class="card" style="max-width:540px;">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">Student ID <span class="text-danger">*</span></label>
        <input type="text" name="student_id" class="form-control"
               placeholder="e.g. 2021-00001" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control"
               placeholder="e.g. Juan dela Cruz" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Course <span class="text-danger">*</span></label>
        <select name="course" class="form-select" required>
          <option value="">-- Select course --</option>
          <option value="BSIT">BSIT</option>
          <option value="BSCS">BSCS</option>
          <option value="BSIS">BSIS</option>
          <option value="BSCpE">BSCpE</option>
          <option value="BSECE">BSECE</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">MAC Address</label>
        <input type="text" name="mac_address" class="form-control font-monospace"
               placeholder="e.g. AA:BB:CC:DD:EE:FF"
               pattern="^([0-9A-Fa-f]{2}[:\-]){5}([0-9A-Fa-f]{2})$">
        <div class="form-text">Optional. Used for automatic router-based attendance.</div>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-save me-1"></i>Save
        </button>
        <a href="{{ url_for('students') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
